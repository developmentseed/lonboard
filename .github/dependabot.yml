version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      deck-loaders-luma:
        patterns:
          - "*deck*"
          - "*loaders*"
          - "*luma*"
          # deck.gl-raster and its sibling packages are versioned together and
          # track deck.gl releases
          - "@developmentseed/*"
        exclude-patterns:
          - "@geoarrow/deck.gl-geoarrow"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "*deck*"
          - "*loaders*"
          - "*luma*"
          - "@developmentseed/*"
          # The wasm binary is loaded from a CDN at a version pinned in
          # src/parquet.ts, which has to be bumped by hand in the same PR
          - "parquet-wasm"
        # Major updates get their own PRs, so that one breaking change doesn't
        # block every other update in the group
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The kernel sets the JupyterLite site's Pyodide version. A new minor
      # version can move it to a new Pyodide ABI, where lonboard can't install
      # until arro3 and geoarrow-rust-core publish wheels for it, so upgrade
      # it by hand (see DEVELOP.md)
      - dependency-name: "jupyterlite-pyodide-kernel"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
