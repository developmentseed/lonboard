name: Publish JupyterLite site via GitHub Pages

# Builds the JupyterLite site in jupyterlite/ and publishes it, unversioned, to
# the jupyterlite/ folder of the gh-pages branch:
# https://developmentseed.org/lonboard/jupyterlite/
#
# deploy-mkdocs.yml calls this after it publishes a stable release's docs. It
# can also be run by hand from main: with dry_run it does everything except
# the push. The notebook installs the latest lonboard from PyPI, so don't
# publish by hand while the newest release isn't on PyPI yet.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and commit the site, but only check the push with --dry-run"
        type: boolean
        default: false

# The push to gh-pages uses the GitHub App token minted below
permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # A run from a feature branch would publish that branch's notebook
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # When called from deploy-mkdocs.yml, this checks out the release tag
      - uses: actions/checkout@v7

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.4.x"

      - name: Build JupyterLite site
        run: uv run --locked --only-group jupyterlite python scripts/build_jupyterlite.py --output-dir "$RUNNER_TEMP/jupyterlite-site"

      # Minted after the build, so the build's third-party code never runs
      # while this job holds a write token
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.DS_RELEASE_BOT_ID }}
          private-key: ${{ secrets.DS_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # gh-pages holds every docs version, about 1 GB, so check out only the
      # jupyterlite/ folder
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/gh-pages
          path: gh-pages
          sparse-checkout: jupyterlite
          token: ${{ steps.app-token.outputs.token }}

      - name: Publish to gh-pages
        working-directory: gh-pages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci-bot@example.com
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci-bot@example.com
        run: |
          # Replace the whole folder: rsync's size and mtime check could skip a
          # changed file
          rm -rf jupyterlite
          cp -R "$RUNNER_TEMP/jupyterlite-site" jupyterlite
          git add -A jupyterlite

          if git diff --cached --quiet; then
            echo "The JupyterLite site is unchanged, nothing to publish"
            exit 0
          fi

          git commit -m "Deployed ${GITHUB_SHA::7} to jupyterlite"
          # Never force. If something else pushed to gh-pages first, this
          # fails, and re-running the job starts again from the new tip.
          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run origin HEAD:gh-pages
          else
            git push origin HEAD:gh-pages
          fi
