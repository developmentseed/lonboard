name: JavaScript Build and Lint

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      # Uses the volta-pinned version in package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run check

      - name: Test
        run: pnpm run test
