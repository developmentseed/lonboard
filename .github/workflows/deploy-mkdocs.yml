name: Publish docs via GitHub Pages

# Only run on new tags starting with `v`
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    # "true" only when this run published a stable release's docs
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.DS_RELEASE_BOT_ID }}
          private-key: ${{ secrets.DS_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        # We need to additionally fetch the gh-pages branch for mike deploy
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.4.x"

      - name: Deploy docs
        id: deploy
        env:
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci-bot@example.com
        run: |
          # Get most recent git tag
          # https://stackoverflow.com/a/7261049
          # We don't use {{github.ref_name}} because if triggered manually, it
          # will be a branch name instead of a tag version.
          VERSION=$(git describe --tags --abbrev=0)

          # Only push docs if no letters in git tag after the first character
          # (usually the git tag will have v as the first character)
          if ! echo $VERSION | sed 's/^.//' | grep -q "[A-Za-z]"; then
            # Publish under the minor version (v0.17.2 -> v0.17) so a patch
            # release replaces its minor's docs instead of adding a copy.
            MINOR=${VERSION%.*}
            uv run --group docs mike deploy $MINOR latest --update-aliases --push
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the JupyterLite site after the docs, from the same ref
  jupyterlite:
    name: JupyterLite
    needs: build
    # The docs job also succeeds on beta tags, without deploying anything
    if: needs.build.outputs.deployed == 'true'
    uses: ./.github/workflows/deploy-jupyterlite.yml
    secrets: inherit
    permissions:
      contents: read
