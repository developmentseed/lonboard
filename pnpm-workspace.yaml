overrides:
  # Uncomment to develop against a local sibling checkout of deck.gl-raster.
  # Keep commented for normal work so pnpm resolves the published versions.
  # '@developmentseed/affine': link:../deck.gl-raster/packages/affine
  # '@developmentseed/deck.gl-geotiff': link:../deck.gl-raster/packages/deck.gl-geotiff
  # '@developmentseed/deck.gl-raster': link:../deck.gl-raster/packages/deck.gl-raster
  # '@developmentseed/deck.gl-zarr': link:../deck.gl-raster/packages/deck.gl-zarr
  # '@developmentseed/epsg': link:../deck.gl-raster/packages/epsg
  # '@developmentseed/geotiff': link:../deck.gl-raster/packages/geotiff
  # '@developmentseed/morecantile': link:../deck.gl-raster/packages/morecantile
  # '@developmentseed/proj': link:../deck.gl-raster/packages/proj
  # '@developmentseed/raster-reproject': link:../deck.gl-raster/packages/raster-reproject
  '@deck.gl/aggregation-layers': '^9.4.0'
  '@deck.gl/core': '^9.4.0'
  '@deck.gl/extensions': '^9.4.0'
  '@deck.gl/geo-layers': '^9.4.0'
  '@deck.gl/layers': '^9.4.0'
  '@deck.gl/mapbox': '^9.4.0'
  '@deck.gl/mesh-layers': '^9.4.0'
  '@deck.gl/widgets': '^9.4.0'
  # Keep every loaders.gl package on one version. @luma.gl/gltf 9.4 requires
  # ~4.4.5 while deck.gl 9.4 accepts ^4.4.3, and loaders.gl packages pin exact
  # versions of each other, so without this some are bundled twice.
  '@loaders.gl/3d-tiles': '~4.4.5'
  '@loaders.gl/core': '~4.4.5'
  '@loaders.gl/gis': '~4.4.5'
  '@loaders.gl/gltf': '~4.4.5'
  '@loaders.gl/images': '~4.4.5'
  '@loaders.gl/loader-utils': '~4.4.5'
  '@loaders.gl/mvt': '~4.4.5'
  '@loaders.gl/schema': '~4.4.5'
  '@loaders.gl/terrain': '~4.4.5'
  '@loaders.gl/textures': '~4.4.5'
  '@loaders.gl/tiles': '~4.4.5'
  '@loaders.gl/wms': '~4.4.5'
  '@luma.gl/constants': '^9.4.2'
  '@luma.gl/core': '^9.4.2'
  '@luma.gl/engine': '^9.4.2'
  '@luma.gl/gltf': '^9.4.2'
  '@luma.gl/shadertools': '^9.4.2'
  '@luma.gl/webgl': '^9.4.2'
  '@types/react-dom': '^19.1.9'
